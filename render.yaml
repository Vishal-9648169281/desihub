databases:
  - name: desihub-db
    databaseName: desihub
    user: desihub
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: desihub-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/videos/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_USE_HTTPS
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://desihub-frontend.onrender.com"
      - key: MAX_VIDEO_UPLOAD_SIZE_MB
        value: "512"
      - key: SEED_DEMO_DATA
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: desihub-db
          property: connectionString

  - type: web
    name: desihub-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://desihub-backend.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://desihub-backend.onrender.com/admin/*
      - type: rewrite
        source: /media/*
        destination: https://desihub-backend.onrender.com/media/*
      - type: rewrite
        source: /static/*
        destination: https://desihub-backend.onrender.com/static/*
      - type: rewrite
        source: /*
        destination: /index.html
